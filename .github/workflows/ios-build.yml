name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add ios || true
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r RJ_Restaurant_POS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Restaurant-POS-IPA
          path: ios/App/RJ_Restaurant_POS.ipa
